name: CI
on:
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_js:
    name: Lint JS (Oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oxc-project/oxlint-action@v2.0.1
        with:
          config: oxlint.config.mts
        continue-on-error: true

  format_js:
    name: Format JS (Oxfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check

  format_c_sharp:
    name: Format C# (dotnet format)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run Dotnet format
        run: |
          dotnet format whitespace --no-restore --verify-no-changes
          dotnet format style --no-restore --verify-no-changes

  test_external_auth:
    name: Test browser and QR authentication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Test login UI, lifecycle, recovery and requests
        run: >-
          npm test --
          src/coordinators/__tests__/externalAuthCoordinator.test.js
          src/views/Login/__tests__/Login.test.js
          src/views/Login/Dialog/__tests__/LoginSettingsDialog.test.js
          src/stores/__tests__/authLoginFailureToast.test.js
          src/services/__tests__/request.test.js
      - run: npm run test:auth-vault
      - run: npm run test:external-auth-backend

  test_build_dotnet_windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Set version
        run: |
          echo "1900.0.0" > Version
          cat Version
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Dotnet/VRCX-Cef.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Cef .NET Application
        run: dotnet build Dotnet/VRCX-Cef.csproj -p:Configuration=Release -p:WarningLevel=0 -p:Platform=x64 -t:"Clean;Build" -maxcpucount --runtime win-x64 --self-contained
